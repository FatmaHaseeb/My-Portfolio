<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <!-- Fixed Font Awesome link -->
    <link 
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <title>Hubnet Portfolio</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            background-color: lightgray;
            font-family: Arial, Helvetica, sans-serif;
        }

        #menu{
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            background-color: whitesmoke;
            box-shadow: 3px 3px 5px gray;
        }
        #menu:hover{
            background-color: lightseagreen;
            border: 2px solid lightseagreen;
            border-radius: 35px;
            
        }

        nav a{
            margin-left: 30px;
            text-decoration: none;
            font-weight: bold;
            font-size: 18px;
            font-style: italic;
            color: rgb(1, 56, 1);
        }
         
        
        
        menu h1{
            font-size: 40px;
            letter-spacing: 3px;
            color: orangered;
            text-shadow: 2px 2px 3px black;
        }

        #pd{
            display: inline-block;
            width: 45%;
            position: relative;
            height: 500px;
        }

        #pp{
            display: inline-block;
            width: 45%;
            position: relative;
            vertical-align: top;
            height: 500px;
        }

        #pd h1{
            position: absolute;
            left: 100px;
            letter-spacing: 2px;
        }

        #hh{
            top: 100px;
        }

        #hhh{
            top: 170px;
        }

        #hhhh{
            top: 240px;
            font-style: italic;
        }

        span{
            color: cyan;
        }

        #cbtn{
            position: absolute;
            top: 350px;
            left: 100px;
            text-decoration: none;
            color: antiquewhite;
            background-color: rgb(1, 49, 1);
            padding: 15px 25px;
            border-radius: 30px;
            font-size: 20px;
            border: 2px solid white;
            box-shadow: 2px 2px 10px maroon;
        }

        #cbtn:hover{
            background-color: maroon;
            color: aliceblue;
        }

        #pp img{
            width: 400px;
            height: 400px;
            border-radius: 50%;
            outline: 3px solid red;
            position: absolute;
            box-shadow: 7px 7px 3px white;
            top: 30px;
            left: 130px;
            object-fit: cover;
        }

        #sml{
            width: 100%;
            height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        .fa-brands{
            font-size: 30px;
            color: black;
            transition: 0.3s;
        }

        .fa-brands:hover{
            color: orangered;
            transform: scale(1.2);
        }
    </style>
</head>

<body>

    <div id="menu">
        <h1>Hubnet</h1>

        <nav>
            <a href="index1.html">Home</a>
            <a href="About.html">About</a>
            <a href="Skill.html">Skill</a>
            <a href="Education.html">Education</a>
            <a href="Work.html">Work</a>
            <a href="Experience.html">Experience</a>
            <a href="Contact">Contact</a>
        </nav>
    </div>

    <div id="pd">
        <h1 id="hh"><span>Hi</span> There</h1>
        <h1 id="hhh">Hubnet Education</h1>
        <h1 id="hhhh">
            I am a full stack web <span>Developer</span>
        </h1>

        <a href="/images/logo.png" download="cv.png" id="cbtn">
            About Me
        </a>
    </div>

    <div id="pp">
        <img src="/images/logo.png" alt="Profile Image">
    </div>

    <div id="sml">
        <a href="#"><i class="fa-brands fa-youtube"></i></a>
        <a href="#"><i class="fa-brands fa-facebook"></i></a>
        <a href="#"><i class="fa-brands fa-instagram"></i></a>
        <a href="#"><i class="fa-brands fa-linkedin"></i></a>
        <a href="#"><i class="fa-brands fa-github"></i></a>
    </div>

</body>
</html>
